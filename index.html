<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="apple-touch-icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1b2430;--mute:#6b7380;--line:#e3e6ea;--pri:#1f3b57;--pri2:#2f5d8a;
--owe:#b45309;--owebg:#fff4e5;--cred:#15803d;--credbg:#e8f6ec;--bad:#b91c1c;--badbg:#fdecec;--warn:#a16207;--warnbg:#fef6dc;--r:12px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:84px}
header.top{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;padding:10px 14px calc(10px);display:flex;align-items:center;gap:10px}
header.top h1{font-size:17px;margin:0;flex:1;font-weight:700}
header.top .who{font-size:12px;opacity:.85}
.demo{background:var(--warnbg);color:var(--warn);font-size:12.5px;padding:6px 14px;text-align:center}
main{padding:12px}
nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .wrap{display:flex;max-width:760px;width:100%}
nav.bottom button{flex:1;border:0;background:none;padding:8px 2px 7px;font-size:11.5px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bottom button .ic{font-size:20px;line-height:1}
nav.bottom button.on{color:var(--pri);font-weight:700}
.card{background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{font-size:15px;margin:0 0 8px}
.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.stat{background:var(--card);border-radius:var(--r);padding:10px 12px}
.stat .k{font-size:12px;color:var(--mute)}.stat .v{font-size:19px;font-weight:700;direction:ltr;text-align:right}
.btn{border:0;border-radius:10px;padding:9px 14px;background:var(--pri);color:#fff;font-weight:600;cursor:pointer}
.btn.sec{background:#e9eef4;color:var(--pri)}.btn.bad{background:var(--bad)}.btn.ghost{background:none;color:var(--pri2);padding:6px 8px}
.btn.sm{padding:6px 10px;font-size:13px}.btn:disabled{opacity:.5}
.btn.block{width:100%}
input.f,select.f,textarea.f{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff}
input.f:focus,select.f:focus,textarea.f:focus{outline:2px solid #b7cde3;border-color:var(--pri2)}
input.num{direction:ltr;text-align:right}
label.l{display:block;font-size:12.5px;color:var(--mute);margin:8px 0 3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:inline-block;font-size:11.5px;border-radius:20px;padding:1px 9px;background:#eef1f5;color:var(--mute);white-space:nowrap}
.chip.draft{background:var(--warnbg);color:var(--warn)}.chip.posted{background:var(--credbg);color:var(--cred)}.chip.cancelled{background:var(--badbg);color:var(--bad)}
.chip.open{background:var(--credbg);color:var(--cred)}.chip.closed{background:#e5e7eb;color:#374151}
.owe{color:var(--owe)}.cred{color:var(--cred)}.muted{color:var(--mute)}.small{font-size:12.5px}.bad{color:var(--bad)}
.amt{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;white-space:nowrap}
.list .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.it .t{font-weight:600}.it .s{font-size:12.5px;color:var(--mute)}
.line{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}.line:last-child{border-bottom:0}
.line.cx{opacity:.55}.line.cx .t{text-decoration:line-through}
.seg{display:flex;background:#e9eef4;border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:6px 4px;font-size:13px;color:var(--pri)}
.seg button.on{background:#fff;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
table.t th{font-size:12px;color:var(--mute);font-weight:600;background:#fafbfc;position:sticky;top:0}
table.t tr.cx td{text-decoration:line-through;opacity:.5}
.scroll{overflow-x:auto}
.stl .r{padding:8px 0;border-bottom:1px solid var(--line)}.stl .r.cx{opacity:.5}.stl .r.cx .d{text-decoration:line-through}
.stl .d{font-size:13.5px}.stl .n{display:flex;gap:10px;font-size:13px;margin-top:2px}.stl .n .grow{color:var(--mute)}
.wide{display:none}@media (min-width:640px){.wide{display:block}.narrow{display:none}}
@media print{.wide{display:block!important}.narrow{display:none!important}}
.sheet-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 6px;font-size:16px}
.typegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.typegrid button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 6px;font-weight:600;color:var(--pri)}
.pick{position:relative}
.pick .dd{position:absolute;inset-inline:0;top:100%;z-index:60;background:#fff;border:1px solid var(--line);border-radius:10px;max-height:240px;overflow:auto;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.pick .dd div{padding:9px 11px;border-bottom:1px solid #f0f2f4;cursor:pointer}.pick .dd div:hover,.pick .dd div.hl{background:#eef4fb}
.pick .sel{font-size:12.5px;color:var(--cred);margin-top:3px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1b2430;color:#fff;padding:9px 16px;border-radius:10px;z-index:90;font-size:14px;max-width:90vw}
.toast.err{background:var(--bad)}
.empty{color:var(--mute);text-align:center;padding:18px 8px;font-size:14px}
.bar{height:8px;border-radius:4px;background:var(--pri2)}
.login{max-width:380px;margin:12vh auto 0;padding:0 16px}
.prog{height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden}.prog>div{height:100%;background:var(--pri2);width:0}
.printonly{display:none}
.pdoc{font-size:12px;color:#000}.pdoc h1{font-size:18px;margin:0;text-align:center}.pdoc h2{font-size:15px;margin:2px 0 0;text-align:center}
.pdoc .meta{display:flex;justify-content:space-between;font-size:11.5px;margin:6px 0 8px;border-bottom:2px solid #000;padding-bottom:5px}
.pdoc table{width:100%;border-collapse:collapse;margin-bottom:8px}.pdoc thead{display:table-header-group}
.pdoc th,.pdoc td{border:1px solid #777;padding:4px 5px;text-align:right;vertical-align:top}.pdoc th{background:#e9edf2;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pdoc tr{page-break-inside:avoid}.pdoc td.n{direction:ltr;text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
.pdoc .sec{font-weight:700;font-size:13px;margin:8px 0 3px}.pdoc .tot td{font-weight:700;background:#f4f6f8;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pdoc .np{color:#a15c00;font-style:italic}.pdoc .box{border:2px solid #000;border-radius:6px;padding:8px 10px;font-size:15px;font-weight:700;text-align:center;margin:8px 0}
.pdoc .note{font-size:11px;color:#333}.pdoc .sign{display:flex;justify-content:space-around;margin-top:22px;font-size:12px}
table.pj{width:100%;border-collapse:collapse;font-size:12px}table.pj th,table.pj td{border:1px solid #999;padding:4px 6px;vertical-align:top}
@media print{.printonly{display:block}.screenonly{display:none!important}
  header.top,nav.bottom,.noprint,.demo,.toast,.sheet-bg{display:none!important}
  body,.app{background:#fff}.card{box-shadow:none;padding:0}main{padding:0}
  table.t{font-size:11px}
  @page{size:A4;margin:11mm}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
'use strict';
// =====================================================================
//  الإعدادات — حط هنا بيانات مشروع Supabase (من Settings → API)
//  لو سبتهم فاضيين الموقع بيشتغل في "الوضع التجريبي" ببيانات وهمية.
// =====================================================================
const CONFIG = {
  supabaseUrl: 'https://vloughqkxyjfwpgehblk.supabase.co',
  supabaseAnonKey: 'sb_publishable_eNhd3OyNTqsqcgIfSOkPjA_3inxIdW2',   // المفتاح العام — مش service_role
  emailDomain: 'hesabat.local'   // أسماء الدخول بتتحول لإيميل وهمي: omar@hesabat.local
};

// ---------------------------------------------------------------- أدوات
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf2 = new Intl.NumberFormat('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 2});
const nf3 = new Intl.NumberFormat('en-US', {maximumFractionDigits: 3});
const fmt = v => (v === null || v === undefined || v === '') ? '' : nf2.format(+v);
const fmtq = v => (v === null || v === undefined || v === '') ? '' : nf3.format(+v);
const round2 = v => Math.round((+v + Number.EPSILON) * 100) / 100;
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const normAr = s => String(s || '').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[ًٌٍَُِّْـ]/g,'').replace(/\s+/g,' ').trim().toLowerCase();
const balTxt = b => { b = +b || 0; if (Math.abs(b) < 0.005) return '<span class="muted">صفر</span>';
  return b > 0 ? `<span class="owe">عليه <span class="amt">${fmt(b)}</span></span>` : `<span class="cred">له <span class="amt">${fmt(-b)}</span></span>`; };
// الرصيد بالكلام من غير سالب وموجب: you=true للطباعة اللي رايحة للعميل
const balWord = (b, you) => { b = +b || 0; if (Math.abs(b) < 0.005) return 'صفر'; return `${fmt(Math.abs(b))} ${b > 0 ? (you ? 'عليك' : 'عليه') : (you ? 'لك' : 'له')}`; };
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
const PRICE_LATER = ['sale', 'sale_return', 'purchase', 'purchase_return'];   // سطور ممكن تترحّل من غير سعر
const needsPrice = l => PRICE_LATER.includes(l.line_type) && (l.price == null || l.price === '');
// زرار ميتداسش مرتين: بيتقفل لحد ما العملية تخلص
async function locked(btns, fn) { btns = [].concat(btns).filter(Boolean); if (btns.some(b => b.dataset.busy)) return;
  btns.forEach(b => { b.dataset.busy = '1'; b.disabled = true; }); try { return await fn(); } finally { btns.forEach(b => { delete b.dataset.busy; if (b.isConnected) b.disabled = false; }); } }
let exLoad; function loadExcelJS() { if (window.ExcelJS) return Promise.resolve();
  return exLoad || (exLoad = new Promise((ok, bad) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
    sc.onload = ok; sc.onerror = () => { exLoad = null; bad(new Error('مكتبة Excel محمّلتش — اتأكد من النت')); }; document.head.appendChild(sc); })); }
function downloadBlob(blob, name) { const u = URL.createObjectURL(blob), a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(u); a.remove(); }, 2000); }
const KIND = {customer:'عميل', supplier:'مورد', both:'عميل ومورد'};
const ROLE = {admin:'المدير', accountant:'المحاسب', employee:'موظف'};
const STATUS = {draft:'مسودة', posted:'مترحّل', cancelled:'ملغي'};
const TYPES = {
  sale:            {label:'بيع',               short:'بيع',      goods:true,  acc:'customer'},
  purchase:        {label:'وارد من مورد',      short:'وارد',     goods:true,  acc:'supplier'},
  receipt:         {label:'تحصيل (فلوس داخلة)', short:'تحصيل',   money:true,  acc:'any', method:true},
  payment:         {label:'دفع (فلوس طالعة)',   short:'دفع',      money:true,  acc:'any', method:true},
  cash_sale:       {label:'بيع نقدي',          short:'نقدي',     goods:true,  free:true, method:true},
  expense:         {label:'مصروف',             short:'مصروف',    money:true,  bearer:true},
  direct_payment:  {label:'عميل دفع لمورد',     short:'دفع مباشر', money:true, acc:'any', counter:true},
  sale_return:     {label:'مرتجع من عميل',      short:'مرتجع',    goods:true,  acc:'customer'},
  purchase_return: {label:'مرتجع لمورد',        short:'مرتجع',    goods:true,  acc:'supplier'},
  cash_transfer:   {label:'تحويل كاش ↔ بنك',    short:'تحويل',    money:true,  transfer:true}
};
const BEARER = {us:'علينا', party:'على العميل (يتضاف على حسابه)', party_direct:'العميل دفعه بنفسه (ملاحظة بس)'};
let toastT;
function toast(msg, err) { clearTimeout(toastT); document.querySelectorAll('.toast').forEach(e => e.remove());
  const d = document.createElement('div'); d.className = 'toast' + (err ? ' err' : ''); d.textContent = msg; document.body.appendChild(d);
  toastT = setTimeout(() => d.remove(), err ? 5000 : 2500); }
function errMsg(e) { const m = (e && (e.message || e.error_description || e.msg)) || String(e);
  if (/row-level security|permission denied/i.test(m)) return 'مش مسموح لك بالعملية دي';
  if (/Invalid login credentials/i.test(m)) return 'اسم الدخول أو الباسورد غلط';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'مفيش اتصال بالإنترنت';
  if (/duplicate key/i.test(m)) return 'موجود قبل كده';
  return m; }
async function run(fn, okMsg) { try { const r = await fn(); if (okMsg) toast(okMsg); return r; } catch (e) { toast(errMsg(e), true); if (e && typeof e === 'object') e._shown = true; throw e; } }
window.addEventListener('unhandledrejection', e => { if (e.reason && e.reason._shown) e.preventDefault(); });
const lineAmount = l => (TYPES[l.line_type]?.goods && l.qty != null && l.price != null) ? round2(l.qty * l.price) : (l.amount != null ? +l.amount : null);

// =====================================================================
//  طبقة البيانات — Supabase
// =====================================================================
function SupaApi() {
  const sb = supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey);
  const email = u => `${String(u).trim().toLowerCase()}@${CONFIG.emailDomain}`;
  const ok = ({data, error}) => { if (error) throw error; return data; };
  async function all(build) { const out = []; for (let from = 0; ; from += 1000) {
      const rows = ok(await build().range(from, from + 999)); out.push(...rows); if (rows.length < 1000) return out; } }
  return {
    demo: false,
    async me() { const {data: {session}} = await sb.auth.getSession(); if (!session) return null;
      return ok(await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle()); },
    async signIn(u, p) { ok(await sb.auth.signInWithPassword({email: email(u), password: p})); return this.me(); },
    async signOut() { await sb.auth.signOut(); },
    async changePassword(p) { ok(await sb.auth.updateUser({password: p})); },
    async lookups() {
      const [w, m, i, a, s] = await Promise.all([sb.from('warehouses').select('*').order('id'), sb.from('payment_methods').select('*').order('sort').order('id'),
        sb.from('items').select('*').order('category').order('name'), all(() => sb.from('item_aliases').select('*')), sb.from('settings').select('*')]);
      return {warehouses: ok(w), methods: ok(m), items: ok(i), aliases: a, settings: Object.fromEntries(ok(s).map(x => [x.key, x.value]))}; },
    async saveRow(table, row) { if (row.id) { const {id, ...rest} = row; return ok(await sb.from(table).update(rest).eq('id', id).select().single()); }
      return ok(await sb.from(table).insert(row).select().single()); },
    async saveAlias(alias, item_id) { return ok(await sb.from('item_aliases').upsert({alias, item_id})); },
    async saveSetting(key, value) { return ok(await sb.from('settings').upsert({key, value})); },
    async accounts() { return all(() => sb.from('account_balances').select('*').order('id')); },
    async createAccount(name, kind, phone) { return ok(await sb.rpc('create_account', {p_name: name, p_kind: kind, p_phone: phone || null})); },
    async updateAccount(id, patch) { return ok(await sb.from('accounts').update(patch).eq('id', id)); },
    async movements(acc) { return all(() => sb.from('movements').select('*').eq('account_id', acc).order('day').order('sort_key').order('id')); },
    async setMovementCancelled(id, c, reason) { return ok(await sb.rpc('set_movement_cancelled', {p_id: id, p_cancel: c, p_reason: reason || null})); },
    async addAdjustment(acc, day, amount, d) { return ok(await sb.rpc('add_adjustment', {p_account: acc, p_day: day, p_amount: amount, p_description: d})); },
    async ensureDay(d) { return ok(await sb.rpc('ensure_day', {d})); },
    async day(d) { const [j, l, c] = await Promise.all([sb.from('journals').select('*').eq('day', d).maybeSingle(),
        all(() => sb.from('journal_lines').select('*').eq('day', d).order('id')), sb.from('cash_counts').select('*').eq('day', d).maybeSingle()]);
      return {journal: ok(j), lines: l, cash: ok(c)}; },
    async pendingDays() { return ok(await sb.from('journals').select('day,status').eq('status', 'open').order('day')); },
    async addLine(row) { const r = await sb.from('journal_lines').insert(row).select().single();
      // نفس السطر وصل قبل كده (ضغطة مرتين أو النت قطع ورجع) — منرجعش نضيفه
      if (r.error && row.client_key && /journal_lines_client_key|duplicate key/i.test(r.error.message || '')) return ok(await sb.from('journal_lines').select('*').eq('client_key', row.client_key).single());
      return ok(r); },
    async updateLine(id, patch) { return ok(await sb.from('journal_lines').update(patch).eq('id', id).select().single()); },
    async pendingPrice() { return all(() => sb.from('journal_lines').select('*').eq('status', 'posted').is('price', null).in('line_type', PRICE_LATER).order('day').order('id')); },
    async pricePosted(id, price) { return ok(await sb.rpc('price_posted_line', {p_id: id, p_price: price})); },
    async methodBalances() { return ok(await sb.from('payment_method_balances').select('*').order('sort').order('id')); },
    async postLine(id) { return ok(await sb.rpc('post_line', {p_id: id})); },
    async unpostLine(id) { return ok(await sb.rpc('unpost_line', {p_id: id})); },
    async cancelLine(id, r) { return ok(await sb.rpc('cancel_line', {p_id: id, p_reason: r})); },
    async closeDay(d) { return ok(await sb.rpc('close_day', {p_day: d})); },
    async reopenDay(d) { return ok(await sb.rpc('reopen_day', {p_day: d})); },
    async cashExpected(d) { return +ok(await sb.rpc('cash_expected', {d})); },
    async saveCashCount(d, a, n) { return ok(await sb.rpc('save_cash_count', {p_day: d, p_actual: a, p_note: n || null})); },
    async lastPrice(acc, item, text) { return ok(await sb.rpc('last_price', {p_account: acc, p_item: item || null, p_item_text: text || null})); },
    async linesRange(from, to) { return all(() => sb.from('journal_lines').select('*').gte('day', from).lte('day', to).neq('status', 'cancelled').order('day').order('id')); },
    async monthSummary(from, to) { return all(() => sb.from('movement_month_summary').select('*').gte('month', from).lte('month', to)); },
    async profiles() { return ok(await sb.from('profiles').select('*').order('created_at')); },
    async updateProfile(id, patch) { return ok(await sb.from('profiles').update(patch).eq('id', id)); },
    async createUser(username, full_name, password) {
      const tmp = supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey, {auth: {persistSession: false, autoRefreshToken: false, storageKey: 'tmp-signup'}});
      ok(await tmp.auth.signUp({email: email(username), password, options: {data: {username, full_name}}})); },
    async audit(limit, table) { let q = sb.from('audit_log').select('*').order('at', {ascending: false}).limit(limit); if (table) q = q.eq('table_name', table); return ok(await q); },

    async insertAccounts(rows) { if (!can.admin()) deny(); return rows.map(r => { if (db.accounts.some(a => a.name === r.name)) throw new Error('duplicate key: ' + r.name); const a = {...r, id: id(), active: true}; db.accounts.push(a); return {id: a.id, legacy_ref: a.legacy_ref, name: a.name}; }); },
    async insertMovements(rows) { if (!can.admin()) deny(); rows.forEach(r => db.movements.push({...r, id: id(), cancelled: !!r.cancelled})); },
    async rollbackImport(bid) { if (!can.admin()) deny(); const n = db.movements.filter(m => m.import_batch_id === bid && m.source === 'import').length;
      db.movements = db.movements.filter(m => !(m.import_batch_id === bid && m.source === 'import')); db.accounts = db.accounts.filter(a => a.import_batch_id !== bid || db.movements.some(m => m.account_id === a.id));
      db.batches.find(b => b.id === bid).status = 'rolled_back'; return n; },
    async linkAccounts(a, b) { if (!can.mgr()) deny('الربط للمحاسب أو المدير بس'); if (a === b) throw new Error('نفس الحساب'); const A = db.accounts.find(x => x.id === a), B = db.accounts.find(x => x.id === b);
      let p = A.party_id || B.party_id || id(); const old = B.party_id; db.accounts.forEach(x => { if (x.id === a || x.id === b || (old && x.party_id === old)) x.party_id = p; }); return p; },
    async unlinkAccount(a) { if (!can.mgr()) deny(); db.accounts.find(x => x.id === a).party_id = null; },
    async upsertItems(rows) { if (!can.admin()) deny(); let n = 0; for (const r of rows) { let it = db.items.find(i => i.name === r.name);
        if (!it) { it = {id: id(), name: r.name, category: r.category, unit: r.unit, active: r.active !== false}; db.items.push(it); } else Object.assign(it, {category: r.category, unit: r.unit, active: r.active !== false});
        for (const a of r.aliases || []) { const o = db.aliases.find(x => x.alias === a); if (o) o.item_id = it.id; else db.aliases.push({alias: a, item_id: it.id}); n++; } } return {items: rows.length, aliases: n}; }
  };
  return api;
}

// نفس شروط الترحيل اللي في قاعدة البيانات — عشان نوري المشاكل قبل الضغط
function validate(l) {
  const p = [], T = TYPES[l.line_type];
  if (['sale', 'sale_return', 'purchase', 'purchase_return'].includes(l.line_type)) {
    if (!l.account_id) p.push('اختار الحساب'); if (!(+l.qty > 0)) p.push('الكمية ناقصة');
  } else if (l.line_type === 'cash_sale') { if (!(+lineAmount(l) > 0)) p.push('لسه متسعّرش'); if (!l.payment_method_id) p.push('اختار طريقة الدفع'); }
  else if (['receipt', 'payment'].includes(l.line_type)) { if (!l.account_id) p.push('اختار الحساب'); if (!(+l.amount > 0)) p.push('المبلغ ناقص'); if (!l.payment_method_id) p.push('اختار طريقة الدفع'); }
  else if (l.line_type === 'direct_payment') { if (!l.account_id || !l.counter_account_id) p.push('اختار اللي دفع واللي استلم'); if (l.account_id && l.account_id === l.counter_account_id) p.push('نفس الحساب في الطرفين'); if (!(+l.amount > 0)) p.push('المبلغ ناقص'); }
  else if (l.line_type === 'expense') { if (!(+l.amount > 0)) p.push('المبلغ ناقص'); if (!l.bearer) p.push('المصروف على مين؟');
    if (l.bearer === 'party' && !l.account_id) p.push('اختار الحساب'); if (l.bearer === 'us' && !l.payment_method_id) p.push('اختار طريقة الدفع'); }
  else if (l.line_type === 'cash_transfer') { if (!(+l.amount > 0) || !l.transfer_dir || !l.payment_method_id) p.push('كمّل بيانات التحويل'); }
  return p;
}

function picker(el, {items, value, placeholder, onPick, allowNew, newLabel}) {
  // items: [{id, name, sub, keys}]
  el.innerHTML = `<div class="pick"><input class="f" placeholder="${esc(placeholder || 'اكتب أول حروف الاسم')}" autocomplete="off"><div class="dd" hidden></div><div class="sel"></div></div>`;
  const inp = $('input', el), dd = $('.dd', el), sel = $('.sel', el);
  let cur = value ?? null, hl = 0, shown = [];
  const setSel = () => { const it = items.find(i => i.id === cur); sel.innerHTML = it ? `✓ ${esc(it.name)}${it.sub ? ' · ' + esc(it.sub) : ''}` : ''; inp.value = it ? it.name : inp.value; };
  const render = () => { const q = normAr(inp.value); shown = (q ? items.filter(i => (i.keys || normAr(i.name)).includes(q)) : items).slice(0, 40);
    dd.innerHTML = shown.map((i, k) => `<div data-k="${k}" class="${k === hl ? 'hl' : ''}">${esc(i.name)}${i.sub ? ` <span class="small muted">${esc(i.sub)}</span>` : ''}</div>`).join('')
      + (allowNew && inp.value.trim() && !items.some(i => normAr(i.name) === q) ? `<div data-new="1">＋ ${esc(newLabel || 'حساب جديد')}: «${esc(inp.value.trim())}»</div>` : '');
    dd.hidden = !dd.innerHTML; };
  inp.oninput = () => { cur = null; sel.innerHTML = ''; hl = 0; render(); onPick && onPick(null); };
  inp.onfocus = () => { render(); };
  inp.onblur = () => setTimeout(() => { dd.hidden = true; }, 180);
  inp.onkeydown = e => { if (e.key === 'ArrowDown') { hl = Math.min(hl + 1, shown.length - 1); render(); e.preventDefault(); } else if (e.key === 'ArrowUp') { hl = Math.max(hl - 1, 0); render(); e.preventDefault(); }
    else if (e.key === 'Enter' && shown[hl]) { choose(shown[hl]); e.preventDefault(); } };
  const choose = it => { cur = it.id; inp.value = it.name; dd.hidden = true; setSel(); onPick && onPick(it); };
  dd.onmousedown = e => { const t = e.target.closest('div[data-k],div[data-new]'); if (!t) return; e.preventDefault();
    if (t.dataset.new) { allowNew(inp.value.trim(), it => { items.push(it); choose(it); }); } else choose(shown[+t.dataset.k]); };
  setSel();
  return {get: () => cur, text: () => inp.value.trim()};
}

function journalPrint(d) {
  const L = d.lines.filter(l => l.status !== 'cancelled'), goods = L.filter(l => TYPES[l.line_type].goods), money = L.filter(l => !TYPES[l.line_type].goods);
  const nm = l => l.line_type === 'direct_payment' ? `${accName(l.account_id)} ← ${accName(l.counter_account_id)}` : (l.account_id ? accName(l.account_id) : (l.free_name || ''));
  const unit = l => S.lk.items.find(i => i.id === l.item_id)?.unit || 'طن';
  const dir = l => { const a = +lineAmount(l) || 0;
    if (['receipt', 'cash_sale'].includes(l.line_type)) return [a, 0];
    if (l.line_type === 'payment' || (l.line_type === 'expense' && l.bearer !== 'party_direct')) return [0, a];
    if (l.line_type === 'cash_transfer') return l.transfer_dir === 'from_bank' ? [a, 0] : [0, a]; return [0, 0]; };
  const det = l => { const t = lineText(l); if (l.line_type === 'direct_payment') return `دفع مباشر ${fmt(l.amount)}${l.notes ? ' · ' + l.notes : ''}`;
    if (l.line_type === 'expense') return `${l.notes || 'مصروف'} · ${(BEARER[l.bearer] || '').split(' (')[0]}${l.bearer === 'party_direct' ? ' ' + fmt(l.amount) : ''}${l.payment_method_id && l.bearer !== 'party_direct' ? ' · ' + methodName(l.payment_method_id) : ''}`;
    return t.main + (l.notes ? ' · ' + l.notes : ''); };
  const sumBy = (arr, f) => arr.reduce((s, l) => s + (f(l) || 0), 0);
  const sales = sumBy(goods.filter(l => ['sale', 'cash_sale'].includes(l.line_type)), lineAmount), np = goods.filter(l => lineAmount(l) == null).length;
  const mIn = sumBy(money, l => dir(l)[0]) + sumBy(goods.filter(l => l.line_type === 'cash_sale'), l => +lineAmount(l) || 0), mOut = sumBy(money, l => dir(l)[1]);
  const qtyBy = {}; goods.forEach(l => { const k = (['purchase', 'sale_return'].includes(l.line_type) ? 'وارد' : 'طالع') + ' ' + itemName(l); qtyBy[k] = (qtyBy[k] || 0) + (+l.qty || 0); });
  const dayName = new Date(S.day + 'T12:00:00').toLocaleDateString('ar-EG', {weekday: 'long'});
  return `<div class="pdoc"><h1>${esc(S.lk.settings.company_name || '')}</h1><h2>اليومية — ${dayName} <span dir="ltr">${S.day}</span></h2>
    <div class="meta"><span>${d.journal?.status === 'closed' ? 'اليوم مقفول' : 'اليوم مفتوح'} · ${L.length} سطر</span><span>اتطبعت: <span dir="ltr">${new Date().toLocaleString('en-GB', {dateStyle: 'short', timeStyle: 'short'})}</span></span></div>
    <div class="sec">البضاعة (${goods.length})</div>
    <table><thead><tr><th style="width:4%">م</th><th style="width:9%">النوع</th><th>الاسم</th><th style="width:19%">الصنف</th><th style="width:9%">الكمية</th><th style="width:10%">السعر</th><th style="width:12%">الجملة</th><th style="width:13%">المخزن / كارت</th></tr></thead><tbody>
    ${goods.map((l, i) => { const a = lineAmount(l); return `<tr><td>${i + 1}</td><td>${TYPES[l.line_type].short}</td><td>${esc(nm(l))}</td><td>${esc(itemName(l))}</td><td><span dir="ltr">${fmtq(l.qty)}</span> ${unit(l)}</td>
      <td class="${l.price == null ? 'np' : 'n'}">${l.price == null ? 'لم يحدد' : fmt(l.price)}</td><td class="n">${a == null ? '' : fmt(a)}</td><td>${esc(whName(l.warehouse_id))}${l.card_no ? ' · ' + esc(l.card_no) : ''}</td></tr>`; }).join('') || '<tr><td colspan="8" style="text-align:center">مفيش</td></tr>'}
    </tbody></table>
    <div class="sec">الفلوس (${money.length})</div>
    <table><thead><tr><th style="width:4%">م</th><th style="width:11%">النوع</th><th style="width:24%">الاسم</th><th>التفاصيل</th><th style="width:13%">داخل</th><th style="width:13%">طالع</th></tr></thead><tbody>
    ${money.map((l, i) => { const [a, b] = dir(l); return `<tr><td>${i + 1}</td><td>${TYPES[l.line_type].short}</td><td>${esc(nm(l))}</td><td>${esc(det(l))}</td><td class="n">${a ? fmt(a) : ''}</td><td class="n">${b ? fmt(b) : ''}</td></tr>`; }).join('') || '<tr><td colspan="6" style="text-align:center">مفيش</td></tr>'}
    <tr class="tot"><td></td><td colspan="3">الإجمالي (+ البيع النقدي في الداخل)</td><td class="n">${fmt(mIn)}</td><td class="n">${fmt(mOut)}</td></tr></tbody></table>
    <table style="width:60%"><tbody><tr class="tot"><td>إجمالي البيع${np ? ' (المتسعّر بس)' : ''}</td><td class="n">${fmt(sales)}</td></tr>
      ${Object.entries(qtyBy).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="n">${fmtq(round2(v))}</td></tr>`).join('')}
      ${np ? `<tr><td class="np" colspan="2">${np} سطر بضاعة السعر لم يحدد</td></tr>` : ''}</tbody></table>
    <div class="sign"><span>كتبها: ..................</span><span>راجعها: ..................</span><span>المحاسب: ..................</span></div></div>`; }
function typeChooser(types) { openSheet(`<h3>نوع السطر</h3><div class="typegrid">${types.map(t => `<button data-t="${t}">${TYPES[t].label}</button>`).join('')}</div>`);
  document.querySelectorAll('.typegrid button').forEach(b => b.onclick = () => lineForm({line_type: b.dataset.t, day: S.day})); }
function lineActions(l, open) {
  if (l.status === 'draft' && open) return lineForm(l);
  const acts = [];
  if (open && l.status === 'posted' && isMgr()) acts.push(['unpost', 'إلغاء الترحيل (عشان التعديل)', 'sec']);
  if (open && l.status !== 'cancelled' && (l.status === 'draft' || isMgr())) acts.push(['cancel', 'إلغاء السطر', 'bad']);
  openSheet(`<h3>${TYPES[l.line_type].label}</h3>${lineRow(l)}<div class="small muted" style="margin:8px 0">رقم السطر ${l.id}${l.posted_at ? ' · اترحّل ' + new Date(l.posted_at).toLocaleString('ar-EG') : ''}</div>
    ${!open ? '<div class="small muted">اليوم مقفول — مفيش تعديل.</div>' : ''}${l.status === 'posted' && !isMgr() ? '<div class="small muted">السطر مترحّل — التعديل للمحاسب.</div>' : ''}
    <div class="row wrap">${acts.map(([k, t, c]) => `<button class="btn ${c}" data-a="${k}">${t}</button>`).join('')}</div>`);
  document.querySelectorAll('[data-a]').forEach(b => b.onclick = async () => {
    if (b.dataset.a === 'unpost') { await run(() => api.unpostLine(l.id), 'السطر رجع مسودة'); closeSheet(); await loadAccounts(); go(S.tab); }

}
function cancelFlow(l) {
  openSheet(`<h3>إلغاء السطر</h3><div class="small muted">السطر هيفضل ظاهر كملغي ومش هيدخل في أي حساب.</div><label class="l">السبب</label><input class="f" id="cr">
    <div style="height:10px"></div><button class="btn bad block" id="cg">إلغاء السطر</button>`, {stack: true});
  $('#cg').onclick = async () => { await run(() => api.cancelLine(l.id, $('#cr').value), 'اتلغى'); closeSheet(true); await loadAccounts(); go(S.tab); };
}

    ${T.bearer ? `<label class="l">المصروف على مين؟</label><select class="f" id="fBear"><option value="">— اختار —</option>${Object.entries(BEARER).map(([k, v]) => `<option value="${k}" ${l.bearer === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
       <div id="bearAcc" ${l.bearer === 'party' || l.bearer === 'party_direct' ? '' : 'hidden'}><label class="l">العميل</label><div id="pAcc2"></div></div>` : ''}

      <div><label class="l">السعر للوحدة (ممكن بعدين)</label><input class="f num" id="fPrice" inputmode="decimal" value="${l.price ?? ''}"></div></div>

    ${T.money ? `<label class="l">المبلغ</label><input class="f num" id="fAmt" inputmode="decimal" value="${l.amount ?? ''}">` : ''}
    ${T.transfer ? `<label class="l">الاتجاه</label><select class="f" id="fDir"><option value="to_bank" ${l.transfer_dir === 'to_bank' ? 'selected' : ''}>إيداع كاش في البنك</option><option value="from_bank" ${l.transfer_dir === 'from_bank' ? 'selected' : ''}>سحب من البنك للكاش</option></select>
       <label class="l">البنك / المحفظة</label><select class="f" id="fMeth">${methodOpts(m => m.kind !== 'cash')}</select>` : ''}
    ${(T.method || T.bearer) ? `<div id="methWrap"><label class="l">طريقة الدفع</label><select class="f" id="fMeth">${methodOpts()}</select>
       <label class="l">رقم العملية (للتحويلات)</label><input class="f num" id="fRef" value="${esc(l.ref_no || '')}"></div>` : ''}
    ${T.bearer ? '' : `<label class="l">ملاحظة</label><input class="f" id="fNotes" value="${esc(l.notes || '')}">`}
    ${T.bearer ? `<label class="l">البيان (نولون، مشال، إكرامية…)</label><input class="f" id="fNotes" value="${esc(l.notes || '')}">` : ''}
    <div style="height:12px"></div><div class="row"><button class="btn grow" id="sv">${isNew ? 'إضافة' : 'حفظ'}</button>${isNew ? '<button class="btn sec" id="svn">إضافة وسطر تاني</button>' : '<button class="btn bad" id="cx">إلغاء السطر</button>'}</div>`);
  const pA = T.acc ? picker($('#pAcc'), {items: accItems(T.acc), value: l.account_id, onPick: async it => { l.account_id = it?.id || null; suggest(); }, allowNew: newAccountFlow(T.acc), newLabel: 'حساب جديد'}) : null;
  const pC = T.counter ? picker($('#pCnt'), {items: accItems('supplier'), value: l.counter_account_id, onPick: it => l.counter_account_id = it?.id || null, allowNew: newAccountFlow('supplier')}) : null;
  const pA2 = T.bearer ? picker($('#pAcc2'), {items: accItems('customer'), value: l.account_id, onPick: it => l.account_id = it?.id || null}) : null;
  const pI = T.goods ? picker($('#pItem'), {items: itemItems(), value: l.item_id, placeholder: 'الصنف — مثلاً الاقصر أو ح12م', onPick: it => { l.item_id = it?.id || null; suggest(); }}) : null;
  async function suggest() { if (!T.goods || !l.account_id || !l.item_id) return; const p = await api.lastPrice(l.account_id, l.item_id, null).catch(() => null);
    $('#calc') && ($('#calc').innerHTML = p != null ? `آخر سعر للعميل ده في الصنف ده: <a href="#" id="useP" class="amt">${fmt(p)}</a>` : ''); $('#useP') && ($('#useP').onclick = e => { e.preventDefault(); $('#fPrice').value = p; }); }
  if ($('#fBear')) { const upd = () => { const v = $('#fBear').value; $('#bearAcc').hidden = !(v === 'party' || v === 'party_direct'); $('#methWrap').hidden = v === 'party_direct'; }; $('#fBear').onchange = upd; upd(); }

// ---------------------------------------------------------------- التسعير
SCREENS.pricing = async () => {
  const d = await api.day(S.day); const open = d.journal?.status === 'open';
  const rows = d.lines.filter(l => l.status === 'draft' && TYPES[l.line_type].goods);
  const pend = await api.pendingPrice().catch(() => []);
  const sugg = {}; await Promise.all([...rows, ...pend].map(async l => { if (l.account_id) sugg[l.id] = await api.lastPrice(l.account_id, l.item_id, l.item_text).catch(() => null); }));
  const prow = (l, en) => `<div class="line"><div class="row"><span class="chip">${TYPES[l.line_type].short}</span><div class="grow t">${esc(l.account_id ? accName(l.account_id) : (l.free_name || 'زبون نقدي'))}</div>${en === 'p' ? `<span class="small muted amt">${l.day}</span>` : ''}</div>
      <div class="small muted">${fmtq(l.qty)} ${esc(itemName(l))}${l.card_no ? ' · كارت ' + esc(l.card_no) : ''}</div>
      <div class="row" style="margin-top:6px"><input class="f num pr" data-id="${l.id}" data-q="${l.qty}" data-k="${en}" inputmode="decimal" placeholder="السعر" value="${l.price ?? ''}" ${en === false ? 'disabled' : ''} style="max-width:150px">
        ${sugg[l.id] != null ? `<button class="btn ghost sm use" data-id="${l.id}" data-p="${sugg[l.id]}">آخر سعر <span class="amt">${fmt(sugg[l.id])}</span></button>` : ''}
        <div class="grow"></div><b class="amt tot" data-id="${l.id}">${l.price != null ? fmt(round2(l.qty * l.price)) : ''}</b></div></div>`;
  shell(`<div class="card"><div class="row"><input type="date" class="f" id="dpick" value="${S.day}" style="max-width:170px"><div class="grow small muted">سطور البضاعة اللي لسه مترحّلتش</div></div></div>
    <div class="card">${rows.map(l => prow(l, open ? 'd' : false)).join('') || '<div class="empty">مفيش سطور مستنية تسعير</div>'}</div>
    ${pend.length ? `<div class="card" style="border:1px solid var(--warn)"><h2>⚠️ مترحّلة و«السعر لم يحدد» <span class="muted small">(${pend.length} — من كل الأيام)</span></h2>
      <div class="small muted" style="margin-bottom:4px">أول ما تحط السعر، المبلغ بيتضاف على الحساب بتاريخ العملية الأصلي.</div>${pend.map(l => prow(l, 'p')).join('')}</div>` : ''}
    ${(rows.length && open) || pend.length ? '<button class="btn block" id="savePrices">حفظ الأسعار</button>' : ''}`);
  $('#dpick').onchange = e => { S.day = e.target.value; go('pricing'); };
  const recalc = inp => { const t = document.querySelector(`.tot[data-id="${inp.dataset.id}"]`); const v = +inp.value.replace(/,/g, ''); t.textContent = inp.value ? fmt(round2(v * +inp.dataset.q)) : ''; };
  document.querySelectorAll('.pr').forEach(i => i.oninput = () => recalc(i));
  document.querySelectorAll('.use').forEach(b => b.onclick = () => { const i = document.querySelector(`.pr[data-id="${b.dataset.id}"]`); i.value = b.dataset.p; recalc(i); });
  $('#savePrices') && ($('#savePrices').onclick = () => locked($('#savePrices'), async () => { let n = 0, bad = 0;
    for (const i of document.querySelectorAll('.pr:not([disabled])')) { const v = i.value.trim() === '' ? null : +i.value.replace(/,/g, '');
      if (i.dataset.k === 'p') { if (v == null) continue; try { await api.pricePosted(+i.dataset.id, v); n++; } catch (e) { bad++; toast(errMsg(e), true); } continue; }
      const l = rows.find(x => x.id === +i.dataset.id); if (v !== (l.price == null ? null : +l.price)) { try { await api.updateLine(l.id, {price: v}); n++; } catch (e) { bad++; toast(errMsg(e), true); } } }
    if (n) await loadAccounts(); if (!bad) toast(n ? `اتحفظ ${n} سعر` : 'مفيش تغيير'); go('pricing'); }));
};

// ---------------------------------------------------------------- المراجعة والترحيل
SCREENS.posting = async () => {
  if (!isMgr()) { shell('<div class="card">الشاشة دي للمحاسب والمدير بس</div>'); return; }
  const d = await api.day(S.day); const open = d.journal?.status === 'open';
  const drafts = d.lines.filter(l => l.status === 'draft'); const okL = drafts.filter(l => !validate(l).length);
  const ready = okL.filter(l => !needsPrice(l)), readyNP = okL.filter(needsPrice);
  const exp = await api.cashExpected(S.day);
  const byMeth = {}; for (const l of d.lines) { if (l.status === 'cancelled' || !l.payment_method_id) continue; const m = S.lk.methods.find(x => x.id === l.payment_method_id); if (!m) continue;
    const sign = ['receipt', 'cash_sale'].includes(l.line_type) ? 1 : (['payment', 'expense'].includes(l.line_type) && l.bearer !== 'party_direct') ? -1 : l.line_type === 'cash_transfer' ? (l.transfer_dir === 'to_bank' ? 1 : -1) : 0;
    if (!sign) continue; byMeth[m.name] = byMeth[m.name] || {in: 0, out: 0, kind: m.kind}; const a = +lineAmount(l) || 0; if (sign > 0) byMeth[m.name].in += a; else byMeth[m.name].out += a; }
  shell(`<div class="card"><div class="row"><input type="date" class="f" id="dpick" value="${S.day}" style="max-width:170px"><span class="chip ${d.journal?.status || ''}">${open ? 'مفتوح' : 'مقفول'}</span></div></div>
    <div class="card"><h2>١. الترحيل</h2><div class="small muted">${drafts.length} سطر مستني · ${ready.length} جاهز للترحيل${readyNP.length ? ` · ${readyNP.length} من غير سعر` : ''}</div>
      ${drafts.map(lineRow).join('')}
      ${open && ready.length ? `<div style="height:8px"></div><button class="btn block" id="postAll">ترحيل الجاهز (${ready.length})</button>` : ''}
      ${open && readyNP.length ? `<div style="height:8px"></div><button class="btn sec block" id="postNP">ترحيل ${readyNP.length} سطر من غير سعر…</button>` : ''}
      <div class="prog" id="pg" hidden style="margin-top:8px"><div></div></div></div>
    <div class="card"><h2>٢. جرد الكاش</h2>

function waText(a, rows, opening, from, n) {
  const last = rows.length ? rows[rows.length - 1].bal : opening, list = n ? rows.slice(-n) : [];

  if (list.length) { lines.push('', n < rows.length ? `آخر ${list.length} حركات:` : 'الحركات:');
    list.forEach(r => { const amt = r.pending_side ? 'السعر لم يحدد' : +r.debit ? `عليك ${fmt(r.debit)}` : +r.credit ? `لك ${fmt(r.credit)}` : '';
      lines.push(`• ${r.day} — ${r.qty ? fmtq(r.qty) + ' ' : ''}${stItem(r)}${r.price && !r.pending_side ? ' × ' + fmt(r.price) : ''} — ${amt}`); }); }

    <div class="card"><h2>رصيد الكاش يوم البداية</h2><div class="small muted">الكاش اللي في الدرج آخر يوم قبل ما تبدأوا على الموقع.</div><div class="grid2"><div><label class="l">التاريخ</label><input type="date" class="f" id="ocd" value="${oc.day || ''}"></div><div><label class="l">المبلغ</label><input class="f num" id="oca" value="${oc.amount ?? ''}"></div></div><div style="height:8px"></div><button class="btn sm" id="ocS">حفظ</button></div>
    <div class="card"><h2>المخازن</h2>${L.warehouses.map(w => `<div class="row" style="margin-bottom:6px"><input class="f" data-wh="${w.id}" value="${esc(w.name)}"><label class="small"><input type="checkbox" data-wha="${w.id}" ${w.active ? 'checked' : ''}> شغال</label></div>`).join('')}
      <div class="row"><input class="f" id="nwh" placeholder="مخزن جديد"><button class="btn sm" id="whS">حفظ</button></div></div>
    <div class="card"><h2>البنوك والمحافظ (طرق الدفع)</h2><div class="small muted">للعلم بس — الرصيد = رصيد البداية + اللي اتسجل في اليومية بعد تاريخه. رصيد الكاش من الخانة اللي فوق.</div>${L.methods.map(m => `<div style="border-bottom:1px solid var(--line);padding:8px 0">
      <div class="row"><input class="f" data-pm="${m.id}" value="${esc(m.name)}"><span class="chip">${kinds[m.kind]}</span><label class="small"><input type="checkbox" data-pma="${m.id}" ${m.active ? 'checked' : ''}> شغال</label></div>
      ${m.kind === 'cash' ? '' : `<div class="grid2" style="margin-top:4px"><div><label class="l">رصيد البداية</label><input class="f num" data-pmo="${m.id}" inputmode="decimal" value="${m.opening_balance ?? ''}"></div><div><label class="l">بتاريخ (آخر اليوم)</label><input type="date" class="f" data-pmd="${m.id}" value="${m.opening_day || ''}"></div></div>
        ${mb.has(m.id) ? `<div class="small" style="margin-top:3px">الرصيد دلوقتي: <b class="amt">${fmt(mb.get(m.id).balance)}</b></div>` : ''}`}</div>`).join('')}
      <div class="row"><input class="f" id="npm" placeholder="اسم البنك / المحفظة"><select class="f" id="npk" style="max-width:120px">${Object.entries(kinds).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div><div style="height:6px"></div><button class="btn sm" id="pmS">حفظ</button></div>
    <div class="card"><h2>الأصناف</h2><input class="f" id="iq" placeholder="ابحث"><div class="list" id="il" style="max-height:340px;overflow:auto"></div>
      <div class="grid2" style="margin-top:8px"><input class="f" id="ni" placeholder="صنف جديد"><select class="f" id="nic"><option>حديد</option><option>أسمنت</option><option>أخرى</option></select></div><div style="height:6px"></div><button class="btn sm" id="niS">إضافة صنف</button></div>`);
  $('#cnS').onclick = async () => { await run(() => api.saveSetting('company_name', $('#cn').value.trim()), 'اتحفظ'); await loadLookups(); go('settings'); };
  $('#ocS').onclick = async () => { await run(() => api.saveSetting('opening_cash', {day: $('#ocd').value, amount: +$('#oca').value.replace(/,/g, '') || 0}), 'اتحفظ'); go('settings'); };
  $('#whS').onclick = async () => { for (const w of L.warehouses) { const n = document.querySelector(`[data-wh="${w.id}"]`).value.trim(), ac = document.querySelector(`[data-wha="${w.id}"]`).checked; if (n !== w.name || ac !== w.active) await run(() => api.saveRow('warehouses', {id: w.id, name: n, active: ac})); }
    if ($('#nwh').value.trim()) await run(() => api.saveRow('warehouses', {name: $('#nwh').value.trim()})); toast('اتحفظ'); go('settings'); };
  $('#pmS').onclick = () => locked($('#pmS'), async () => { for (const m of L.methods) { const n = document.querySelector(`[data-pm="${m.id}"]`).value.trim(), ac = document.querySelector(`[data-pma="${m.id}"]`).checked;
      const oi = document.querySelector(`[data-pmo="${m.id}"]`), di = document.querySelector(`[data-pmd="${m.id}"]`);
      const ob = oi ? (oi.value.trim() === '' ? null : +oi.value.replace(/,/g, '')) : (m.opening_balance ?? null), od = di ? (di.value || null) : (m.opening_day || null);
      if (ob != null && !od) { toast(`حط تاريخ رصيد البداية لـ ${n}`, true); return; }
      if (n !== m.name || ac !== m.active || ob !== (m.opening_balance == null ? null : +m.opening_balance) || od !== (m.opening_day || null))
        await run(() => api.saveRow('payment_methods', {id: m.id, name: n, active: ac, ...(oi ? {opening_balance: ob, opening_day: od} : {})})); }
    if ($('#npm').value.trim()) await run(() => api.saveRow('payment_methods', {name: $('#npm').value.trim(), kind: $('#npk').value, sort: L.methods.length})); toast('اتحفظ'); go('settings'); });
  const drawI = () => { const q = normAr($('#iq').value); $('#il').innerHTML = L.items.filter(i => !q || normAr(i.name).includes(q)).map(i => `<div class="it" data-it="${i.id}"><div class="grow"><div class="t">${esc(i.name)}</div><div class="s">${i.category} · ${i.unit} · ${L.aliases.filter(a => a.item_id === i.id).length} اسم قديم</div></div>${i.active ? '' : '<span class="chip">موقوف</span>'}</div>`).join('');
    document.querySelectorAll('[data-it]').forEach(e => e.onclick = () => itemEdit(L.items.find(i => i.id === +e.dataset.it))); };
  $('#iq').oninput = drawI; drawI();
  $('#niS').onclick = async () => { if (!$('#ni').value.trim()) return; await run(() => api.saveRow('items', {name: $('#ni').value.trim(), category: $('#nic').value}), 'اتضاف'); go('settings'); };
};
function itemEdit(i) {

    <div class="grid2"><div><label class="l">النوع</label><select class="f" id="ic">${['حديد', 'أسمنت', 'أخرى'].map(c => `<option ${c === i.category ? 'selected' : ''}>${c}</option>`).join('')}</select></div><div><label class="l">الوحدة</label><input class="f" id="iu" value="${esc(i.unit)}"></div></div>
    <label class="l"><input type="checkbox" id="ia" ${i.active ? 'checked' : ''}> شغال</label>
    <label class="l">الأسماء القديمة اللي بتتكتب بيها (اسم في كل سطر)</label><textarea class="f" id="ial" rows="4">${esc(al.join('\n'))}</textarea>
    <div style="height:10px"></div><button class="btn block" id="is">حفظ</button>`);
  $('#is').onclick = async () => { await run(() => api.saveRow('items', {id: i.id, name: $('#in').value.trim(), category: $('#ic').value, unit: $('#iu').value.trim(), active: $('#ia').checked}));
    for (const a of $('#ial').value.split('\n').map(s => s.trim()).filter(Boolean)) if (!al.includes(a)) await run(() => api.saveAlias(a, i.id));
    toast('اتحفظ'); closeSheet(); await loadLookups(); go('settings'); };
}

SCREENS.audit = async () => {
  if (!isAdmin()) return shell('<div class="card">للمدير بس</div>');
  S.auF = S.auF || ''; const rows = await api.audit(200, S.auF || null); const ps = await api.profiles(); const who = id => ps.find(p => p.id === id)?.full_name || ps.find(p => p.id === id)?.username || '—';
  const TN = {journal_lines: 'اليومية', movements: 'الحركات', accounts: 'الحسابات', journals: 'الأيام', cash_counts: 'الجرد', profiles: 'المستخدمين', items: 'الأصناف', settings: 'الإعدادات', warehouses: 'المخازن', payment_methods: 'طرق الدفع', import_batches: 'الاستيراد'};
  const diff = r => { if (!r.old_data || !r.new_data) return ''; const ks = Object.keys(r.new_data).filter(k => !['updated_at', 'priced_at', 'posted_at'].includes(k) && JSON.stringify(r.old_data[k]) !== JSON.stringify(r.new_data[k]));
    return ks.map(k => `${k}: ${esc(JSON.stringify(r.old_data[k]))} ← ${esc(JSON.stringify(r.new_data[k]))}`).join('<br>'); };
  shell(`<div class="card"><select class="f" id="tf"><option value="">كل الجداول</option>${Object.entries(TN).map(([k, v]) => `<option value="${k}" ${S.auF === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
    <div class="card">${rows.map(r => `<div class="line"><div class="row"><div class="grow t">${{INSERT: 'إضافة', UPDATE: 'تعديل', DELETE: 'حذف', ROLLBACK: 'إلغاء استيراد'}[r.action] || r.action} · ${TN[r.table_name] || r.table_name} ${esc(r.row_pk || '')}</div><span class="small muted amt">${new Date(r.at).toLocaleString('en-GB')}</span></div>
      <div class="small muted">${esc(who(r.user_id))}</div>${diff(r) ? `<div class="small" style="direction:ltr;text-align:left;background:#f7f8fa;border-radius:8px;padding:6px 8px;margin-top:4px;overflow-wrap:anywhere">${diff(r)}</div>` : ''}</div>`).join('') || '<div class="empty">مفيش</div>'}</div>`);
  $('#tf').onchange = e => { S.auF = e.target.value; go('audit'); };
};

// ---------------------------------------------------------------- الاستيراد
function parseCSV(text) { const rows = []; let row = [], f = '', q = false; text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) { const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === ',') { row.push(f); f = ''; } else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; } else if (c !== '\r') f += c; }
  if (f || row.length) { row.push(f); rows.push(row); } const h = rows.shift(); return rows.filter(r => r.length > 1).map(r => Object.fromEntries(h.map((k, i) => [k, r[i] ?? '']))); }
SCREENS.import = async () => {
  if (!isAdmin()) return shell('<div class="card">للمدير بس</div>');
  const bs = await api.batches();
  shell(`<div class="card"><h2>استيراد بيانات الإكسيل</h2><div class="small muted">ارفع الملفين اللي طلعوا من المراجعة: <b>accounts.csv</b> و <b>movements.csv</b>. الاستيراد بيتعمل كدفعة واحدة وتقدر تلغيها بالكامل.</div>
      <label class="l">accounts.csv</label><input type="file" id="fa" accept=".csv"><label class="l">movements.csv</label><input type="file" id="fm" accept=".csv">
      <div class="small muted">ملف التحديثات (دلتا) فيه حسابات موجودة قبل كده: بتتعرف بالاسم ومبتتكررش.</div>
      <div id="pv" class="small" style="margin-top:8px"></div><div style="height:8px"></div><button class="btn block" id="go" disabled>استيراد</button>
      <div class="prog" id="pg" hidden style="margin-top:8px"><div></div></div><div id="res" class="small" style="margin-top:8px"></div></div>
    <div class="card"><h2>الأصناف</h2><div class="small muted">ارفع <b>items.csv</b> (الأصناف الموحّدة وأسماءها القديمة) بعد ما تراجع قايمة الأصناف.</div>
      <input type="file" id="fi" accept=".csv" style="margin-top:6px"><div id="ires" class="small" style="margin-top:6px"></div></div>
    <div class="card"><h2>ربط الحسابات</h2><div class="small muted">ارفع <b>links.csv</b> (حسابات لنفس الشخص) من نتيجة المراجعة.</div>
      <input type="file" id="fl" accept=".csv" style="margin-top:6px"><div id="lres" class="small" style="margin-top:6px"></div></div>
    <div class="card"><h2>الدفعات</h2>${bs.map(b => `<div class="line"><div class="row"><div class="grow"><div class="t">${esc(b.label)}</div><div class="small muted">${b.rows} صف · ${new Date(b.created_at).toLocaleString('en-GB')}</div></div>
      <span class="chip ${b.status === 'active' ? 'posted' : 'cancelled'}">${b.status === 'active' ? 'شغالة' : 'اتلغت'}</span>${b.status === 'active' ? `<button class="btn sm bad" data-rb="${b.id}">إلغاء الدفعة</button>` : ''}</div></div>`).join('') || '<div class="empty">مفيش</div>'}</div>`);
  let A = null, M = null;
  let byName = new Map(); const refreshNames = async () => { await loadAccounts(); byName = new Map(S.accounts.map(a => [a.name, a.id])); }; await refreshNames();
  const check = () => { if (!A || !M) return; const byL = new Map(A.map(a => [a.legacy_id, a]));
    const exist = A.filter(a => a.existing === '1'), missingExist = exist.filter(a => !byName.has(a.name)), clash = A.filter(a => a.existing !== '1' && byName.has(a.name));
    const bad = M.filter(m => !byL.has(m.legacy_account_id));
    $('#pv').innerHTML = `${A.length - exist.length} حساب جديد · ${exist.length} حساب موجود · ${M.length} حركة`
      + (bad.length ? ` · <span class="bad">${bad.length} حركة حسابها مش موجود في الملف</span>` : '')
      + (missingExist.length ? `<div class="bad">حسابات المفروض موجودة ومش لاقيها: ${missingExist.slice(0, 10).map(a => esc(a.name)).join('، ')}</div>` : '')
      + (clash.length ? `<div class="bad">حسابات جديدة اسمها موجود قبل كده: ${clash.slice(0, 10).map(a => esc(a.name)).join('، ')}</div>` : '');
    $('#go').disabled = !!(bad.length || missingExist.length || clash.length); };
  $('#fi').onchange = async e => { const f = e.target.files[0]; if (!f) return; const rows = parseCSV(await f.text()).map(r => ({name: r.name.trim(), category: r.category || 'أخرى', unit: r.unit || 'طن', active: r.active !== '0', aliases: (r.aliases || '').split('|').map(x => x.trim()).filter(Boolean)}));
    const res = await run(() => api.upsertItems(rows)); await loadLookups(); $('#ires').innerHTML = `<span class="cred">✅ ${res.items} صنف و ${res.aliases} اسم قديم</span>`; };
  $('#fl').onchange = async e => { const f = e.target.files[0]; if (!f) return; await loadAccounts(); const nm = new Map(S.accounts.map(a => [a.name, a.id])); let ok = 0; const miss = [];
    for (const r of parseCSV(await f.text())) { const a = nm.get(r.account_a), b = nm.get(r.account_b); if (!a || !b) { miss.push(r.account_a + ' / ' + r.account_b); continue; } await run(() => api.linkAccounts(a, b)); ok++; }
    $('#lres').innerHTML = `<span class="cred">✅ اتربط ${ok}</span>${miss.length ? `<div class="bad">مش لاقي: ${miss.map(esc).join('، ')}</div>` : ''}`; };
  const read = (inp, cb) => inp.onchange = async () => { const f = inp.files[0]; if (!f) return; cb(parseCSV(await f.text())); await refreshNames(); check(); };
  read($('#fa'), r => A = r); read($('#fm'), r => M = r);
  $('#go').onclick = async () => { $('#go').disabled = true; const pg = $('#pg'); pg.hidden = false; const set = p => pg.firstChild.style.width = p + '%';
    try {
      const b = await api.createBatch('إكسيل ' + new Date().toLocaleString('en-GB'));
      const ids = new Map(); A.filter(a => a.existing === '1').forEach(a => ids.set(a.legacy_id, byName.get(a.name)));
      const NA = A.filter(a => a.existing !== '1');
      for (let i = 0; i < NA.length; i += 200) { const chunk = NA.slice(i, i + 200).map(a => ({name: a.name, kind: a.kind, legacy_ref: a.legacy_ref || null, notes: a.notes || null, import_batch_id: b.id, ...(a.grp ? {grp: a.grp} : {})}));
        const res = await api.insertAccounts(chunk); res.forEach((r, k) => ids.set(NA[i + k].legacy_id, r.id)); set(5 + i / NA.length * 15); }
      const num = v => v === '' || v == null ? null : +v;
      for (let i = 0; i < M.length; i += 500) { await api.insertMovements(M.slice(i, i + 500).map(m => ({account_id: ids.get(m.legacy_account_id), day: m.day, sort_key: +m.sort_key || 0,
          debit: +m.debit || 0, credit: +m.credit || 0, item_text: m.item_text || null, qty: num(m.qty), price: num(m.price), description: m.description || null, notes: m.notes || null,
          source: 'import', import_batch_id: b.id, src_sheet: m.src_sheet || null, src_row: num(m.src_row), excel_balance: num(m.excel_balance), cancelled: m.cancelled === '1'})));
        set(20 + i / M.length * 75); }
      await api.setBatchRows(b.id, M.length); set(100); await loadAccounts();
      const mism = A.filter(a => a.expected_balance !== '' && Math.abs((S.accById.get(ids.get(a.legacy_id))?.balance || 0) - +a.expected_balance) > 0.005);
      $('#res').innerHTML = mism.length ? `<div class="bad">⚠️ ${mism.length} حساب رصيدهم مش مطابق:</div>${mism.slice(0, 50).map(a => `<div>${esc(a.name)}: المتوقع ${fmt(a.expected_balance)} — في الموقع ${fmt(S.accById.get(ids.get(a.legacy_id))?.balance)}</div>`).join('')}`
        : `<div class="cred">✅ كل الـ ${A.length} حساب رصيدهم مطابق للمتوقع.</div>`;
    } catch (e) { toast(errMsg(e), true); $('#res').innerHTML = `<div class="bad">وقف بسبب: ${esc(errMsg(e))} — الغي الدفعة من تحت وجرب تاني.</div>`; }
  };
  document.querySelectorAll('[data-rb]').forEach(b => b.onclick = async () => { if (!confirm('متأكد؟ كل حركات الدفعة دي هتتمسح.')) return; const n = await run(() => api.rollbackImport(+b.dataset.rb)); toast(`اتمسح ${n} حركة`); go('import'); });
};
